name: mysql-source-upstream

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Bump to the latest MySQL 8.0 tag
        run: |
          latest=$(git ls-remote --tags --refs https://github.com/mysql/mysql-server 'mysql-8.0.*' | awk -F/ '{print $3}' | grep -E '^mysql-8\.0\.[0-9]+$' | sort -V | tail -1)
          if gh release view "mysql-src-${latest#mysql-}" >/dev/null 2>&1; then
            echo "mysql-src-${latest#mysql-} is already released"
            exit 0
          fi
          git -C mysql-server fetch --depth 1 origin tag "$latest"
          git -C mysql-server checkout "$latest"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -am "Bump mysql-server to $latest"
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the build directly.
          gh workflow run mysql-source.yml --ref "$GITHUB_REF_NAME"
