name: mysql

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mysql/VERSION
      - .github/workflows/mysql.yml

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
            asset: macos15-arm64.tar.gz
          - target: darwin-x64
            runner: macos-15-intel
            asset: macos15-x86_64.tar.gz
          - target: linux-x64
            runner: ubuntu-24.04
            asset: linux-glibc2.17-x86_64-minimal.tar.xz
            deb_mirror: http://archive.ubuntu.com/ubuntu
            deb_arch: amd64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            asset: linux-glibc2.28-aarch64.tar.xz
            deb_mirror: http://ports.ubuntu.com/ubuntu-ports
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Download
        run: |
          v=$(cat mysql/VERSION)
          curl -fsSL -o mysql-dl "https://cdn.mysql.com/Downloads/MySQL-8.0/mysql-$v-${{ matrix.asset }}"
          mkdir pkg
          tar -xf mysql-dl -C pkg --strip-components=1
          rm mysql-dl

      - name: Prune
        working-directory: pkg
        run: |
          find bin -type f ! -name mysqld ! -name mysql ! -name '*.dylib' ! -name '*.so*' -delete
          rm -rf lib/*.a lib/mecab include man docs mysql-test lib/plugin/debug
          du -sh .

      - name: Check RUNPATH
        if: runner.os == 'Linux'
        working-directory: pkg
        run: |
          for b in bin/mysqld bin/mysql; do
            readelf -d "$b" | grep -E 'RUNPATH|RPATH' | tee /dev/stderr | grep -q '\$ORIGIN/../lib/private' || { echo "$b has no \$ORIGIN/../lib/private RUNPATH"; exit 1; }
          done

      - name: Add old Linux libraries
        if: runner.os == 'Linux'
        run: |
          a=${{ matrix.deb_arch }}
          case $a in
            amd64) sums="2dcfe0b49d7cccfbf1bd6a3f627cf44bea9f51fb32f7e0e552a0df75698e0d27 d9b8efb37a056e01c46d93c7ef6977aa04ad2586978137d9a3954c15ad5d14c3 d2597b5aec92a930cf549e1b429ad892595813e72ec7814685ea146a9fb715e5" ;;
            arm64) sums="1bcb0d9c08aa35298741b1c68904844e9b71ebf64f15b3e05e6ec6f3fa01d93b 9fbcc4982756f6a975cb26c1a9323690d622c557b64e184c38746f0dbb19ea92 bff6bf29035a4bbd5aa3584bfbc86c2d414cb468a22dbd09fe601b0d39ce4e67" ;;
          esac
          set -- $sums
          for deb in liba/libaio/libaio1_0.3.112-13build1 n/ncurses/libncurses5_6.3-2 n/ncurses/libtinfo5_6.3-2; do
            case $deb in liba/*) comp=main ;; *) comp=universe ;; esac
            f=$(basename "$deb")_$a.deb
            curl -fsSL -o "$f" "${{ matrix.deb_mirror }}/pool/$comp/$deb"_$a.deb
            echo "$1  $f" | sha256sum -c
            shift
            dpkg-deb -x "$f" debs
          done
          mkdir -p pkg/lib/private
          for l in libaio.so.1 libncurses.so.5 libtinfo.so.5; do
            cp -L "$(find debs -name "$l" | head -1)" pkg/lib/private/"$l"
          done
          ls -l pkg/lib/private

      - name: Verify
        working-directory: pkg
        run: |
          bin/mysqld --version
          bin/mysql --version
          for b in bin/mysqld bin/mysql; do
            if [ "$(uname)" = Darwin ]; then
              otool -L "$b"
              bad=$(otool -L "$b" | tail -n +2 | awk '{print $1}' | grep -vE '^(@rpath/|@loader_path/|/usr/lib/|/System/)' || true)
            else
              ldd "$b"
              bad=$(ldd "$b" | grep 'not found' || true)
            fi
            if [ -n "$bad" ]; then
              echo "$b has unresolved libraries:"
              echo "$bad"
              exit 1
            fi
          done

      - name: Smoke test
        working-directory: pkg
        run: |
          bin/mysqld --no-defaults --initialize-insecure --datadir="$RUNNER_TEMP/d" --basedir="$PWD"
          bin/mysqld --no-defaults --datadir="$RUNNER_TEMP/d" --basedir="$PWD" --socket="$RUNNER_TEMP/s.sock" --port=3399 --log-error="$RUNNER_TEMP/err.log" &
          pid=$!
          for i in $(seq 60); do
            bin/mysql -uroot -h127.0.0.1 -P3399 -e 'select version()' && ok=1 && break
            sleep 1
          done
          kill $pid || true
          wait $pid || true
          if [ -z "$ok" ]; then
            cat "$RUNNER_TEMP/err.log"
            exit 1
          fi

      - run: tar -czf mysql-${{ matrix.target }}.tar.gz -C pkg $(ls -A pkg)

      - uses: actions/upload-artifact@v4
        with:
          name: mysql-${{ matrix.target }}
          path: mysql-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="mysql-$(cat mysql/VERSION)"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Oracle's MySQL ${tag#mysql-} binaries, pruned to mysqld and mysql. Linux builds also carry libaio, libncurses and libtinfo from Ubuntu 22.04 in lib/private."
          gh release upload "$tag" dist/*.tar.gz --clobber
